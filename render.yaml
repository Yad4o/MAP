# render.yaml — MAP Infrastructure as Code
# Defines both the web service and Celery background worker.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to your repo root.
#   2. In Render dashboard → New → Blueprint → connect repo.
#   3. Render reads this file and creates both services automatically.
#   4. Fill in the secret env vars in the Render dashboard after creation.

services:

  # ── Web Service (FastAPI) ───────────────────────────────────
  - type: web
    name: map-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # change to standard/pro as needed
    region: oregon         # change to match your users
    branch: main
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # ── Database (set manually in dashboard) ──────────────
      - key: DATABASE_URL
        sync: false        # marks as secret — you fill in the value

      # ── Auth (set manually in dashboard) ──────────────────
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: RS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # ── Redis / Celery (set manually in dashboard) ────────
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

      # ── AI (set manually in dashboard) ────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PRIMARY_AI_PROVIDER
        value: groq
      - key: DEFAULT_MODEL
        value: llama-3.3-70b-versatile
      - key: FALLBACK_MODEL
        value: llama-3.1-8b-instant

      # ── CORS (set after Vercel gives you the URL) ─────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # e.g. https://your-app.vercel.app

  # ── Background Worker (Celery) ──────────────────────────────
  - type: worker
    name: map-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    branch: main
    # Override the web service CMD with the Celery worker command
    dockerCommand: >-
      celery -A app.worker.celery_app.celery_app worker
      --loglevel=info
      -Q default,high_priority,long_running

    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PRIMARY_AI_PROVIDER
        value: groq
      - key: DEFAULT_MODEL
        value: llama-3.3-70b-versatile
      - key: FALLBACK_MODEL
        value: llama-3.1-8b-instant
