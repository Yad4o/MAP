[pytest]
testpaths = backend/tests tests
asyncio_mode = auto
# All async fixtures share the session-scoped event loop so that session-scoped
# fixtures (engine, db_session) and function-scoped dependents (client,
# create_test_user, auth_headers) are compatible. Without this, pytest-asyncio
# >= 0.23 raises ValueError at collection time: "Fixture 'db_session' with
# loop_scope 'session' can't be used by a fixture with loop_scope 'function'".
asyncio_default_fixture_loop_scope = session
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# backend — for `from app.*` imports
# .       — for `from agents.*` imports (top-level agents/ package)
pythonpath = backend .
