[pytest]
# scripts/smoke_test.py is a manual CLI script (hits a live local server,
# unguarded exit(1) on failure) that happens to match pytest's default
# `*_test.py` collection pattern. Without this, pytest imports it during
# collection and its top-level exit(1) crashes the whole run before any
# real test executes. Scoping collection to tests/ fixes it and prevents
# any future scripts/*_test.py-named file from doing the same.
testpaths = tests
python_files = test_*.py
